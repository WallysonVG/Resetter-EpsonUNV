name: Gerar ResetEpson.exe

on:
  push:
    branches: [main]
    paths: ["*.py", ".github/workflows/gerar-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar executável
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --console --clean --name ResetEpson reset.py
      - name: Atualizar release/ResetEpson.exe
        shell: bash
        run: |
          mkdir -p release
          cp dist/ResetEpson.exe release/ResetEpson.exe
          echo "SHA-256 do ResetEpson.exe: $(sha256sum release/ResetEpson.exe | cut -d' ' -f1)" > release/SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/
          git diff --cached --quiet || git commit -m "Atualiza ResetEpson.exe [skip ci]"
          git push
